# NoticeGuard Configuration
app:
  name: "NoticeGuard"
  version: "1.0.0"
  host: "127.0.0.1"
  port: 8501
  gather_usage_stats: false

ollama:
  enabled: true
  base_url: "http://127.0.0.1:11434"
  model: "YOUR-TAG-HERE"
  fallback_model: "YOUR-TAG-HERE"
  timeout_seconds: 120
  max_retries: 1
  temperature: 0.1
  
verifier:
  fuzzy_threshold: 88.0
  max_quote_length: 500
  require_nfc: true
  strict_amounts: true

storage:
  temp_dir: "noticeguard_temp"
  wipe_on_session_end: true
  log_document_content: false

languages:
  default: "en"
  supported:
    - code: "en"
      name: "English"
    - code: "hi"
      name: "हिंदी (Hindi)"
    - code: "te"
      name: "తెలుగు (Telugu)"
